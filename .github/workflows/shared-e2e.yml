name: Interface compartilhada

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_HUB_MODE: shared
      VITE_SUPABASE_URL: https://mock-hub.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/security-review.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- shared-finance.spec.mjs central-knowledge.spec.mjs
      - name: Regressão do modo local
        run: VITE_HUB_MODE=local VITE_SUPABASE_URL= VITE_SUPABASE_PUBLISHABLE_KEY= npm run test:e2e -- backup.spec.mjs

  preview-externa:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/mesa-de-trabalho' || github.head_ref == 'feat/indicadores-fechamento' || github.head_ref == 'feat/experiencia-portal' || github.head_ref == 'feat/historico-indicadores' || github.head_ref == 'feat/reunioes-projetos' || github.head_ref == 'feat/hierarquia-experiencia' || github.head_ref == 'feat/fichas-propostas' || github.head_ref == 'feat/busca-global' || github.head_ref == 'feat/atividades-acompanhamentos') && vars.HUB_HML_PREVIEW_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: decifaz-homologacao-externa
      cancel-in-progress: false
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_HML_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_HML_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar rede para dependências dos navegadores
        run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: xvfb-run npx playwright test --config homologacao.config.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: homologacao-externa-capturas
          path: .validation/external-captures
          retention-days: 7
