name: Interface compartilhada

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_HUB_MODE: shared
      VITE_SUPABASE_URL: https://mock-hub.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- shared-finance.spec.mjs
