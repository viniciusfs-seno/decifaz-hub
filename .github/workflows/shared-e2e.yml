name: Interface compartilhada

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  financial-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/revisao-financeira-semanal'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_FINANCIAL_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_FINANCIAL_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - run: node scripts/financial-week-preview.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: revisao-financeira-previa-externa
          path: .validation/financial-external
          retention-days: 14
  turn-secret-input-windows:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/compartilhamento-tela'
    runs-on: windows-2025
    strategy:
      matrix:
        engine: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v4
      - name: Validar entrada oculta sem chave ou API reais
        run: "& '${{ matrix.engine }}' -NoProfile -File scripts/test-turn-hidden-input.ps1"
  screen-release-gate:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/compartilhamento-tela'
    needs: [screen-external]
    runs-on: ubuntu-24.04
    env:
      MEDIA_RESULT: ${{ needs.screen-external.result }}
      MEDIA_VERIFIED: ${{ needs.screen-external.outputs.verified }}
      RELAY_VERIFIED: ${{ needs.screen-external.outputs.relay_verified }}
    steps:
      - name: Exigir mídia entre redes no SHA candidato
        run: |
          if [ "$MEDIA_RESULT" != success ] || [ "$MEDIA_VERIFIED" != true ] || [ "$RELAY_VERIFIED" != true ]; then
            echo 'Publicação bloqueada: mídia externa com relay forçado não comprovada; prévia e vídeo local não substituem este gate.'
            exit 1
          fi
  daily-external:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/compartilhamento-tela' && vars.HUB_SCREEN_PROBE_ENABLED == 'true' && vars.HUB_SCREEN_HML_PREVIEW_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_SCREEN_HML_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_SCREEN_HML_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - run: node scripts/daily-external-review.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: guia-diario-previa-protegida
          path: .validation/daily-external
          retention-days: 7
  screen-external:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/compartilhamento-tela' && vars.HUB_SCREEN_PROBE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      verified: ${{ steps.media.outputs.verified }}
      relay_verified: ${{ steps.media.outputs.relay_verified }}
    env:
      HUB_SCREEN_FORCE_RELAY: ${{ vars.HUB_SCREEN_FORCE_RELAY }}
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_SCREEN_HML_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_SCREEN_HML_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - name: Conferir guia diário na prévia externa isolada
        run: node scripts/daily-external-review.mjs
      - id: media
        run: node scripts/screen-external-viewer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-recebida-entre-redes
          path: |
            .validation/screen-external
            .validation/daily-external
          retention-days: 7
  avisos-preview-externa:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/avisos-agendados' && github.event.pull_request.head.repo.full_name == github.repository && vars.HUB_HML_PREVIEW_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_HML_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_HML_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/notice-preview-external.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: avisos-previa-externa
          path: .validation/notice-external
          retention-days: 7
  shared-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_HUB_MODE: shared
      VITE_SUPABASE_URL: https://mock-hub.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/security-review.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- shared-finance.spec.mjs central-knowledge.spec.mjs
      - name: Regressão do modo local
        run: VITE_HUB_MODE=local VITE_SUPABASE_URL= VITE_SUPABASE_PUBLISHABLE_KEY= npm run test:e2e -- backup.spec.mjs

  preview-externa:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/mesa-de-trabalho' || github.head_ref == 'feat/indicadores-fechamento' || github.head_ref == 'feat/experiencia-portal' || github.head_ref == 'feat/historico-indicadores' || github.head_ref == 'feat/reunioes-projetos' || github.head_ref == 'feat/hierarquia-experiencia' || github.head_ref == 'feat/fichas-propostas' || github.head_ref == 'feat/busca-global' || github.head_ref == 'feat/atividades-acompanhamentos') && vars.HUB_HML_PREVIEW_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: decifaz-homologacao-externa
      cancel-in-progress: false
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_HML_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_HML_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Preparar rede para dependências dos navegadores
        run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: xvfb-run npx playwright test --config homologacao.config.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: homologacao-externa-capturas
          path: .validation/external-captures
          retention-days: 7
