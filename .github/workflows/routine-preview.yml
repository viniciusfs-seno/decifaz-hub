name: Prévia da rotina comercial
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routine-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/indicadores-comerciais'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUB_HML_PREVIEW_URL: ${{ vars.HUB_ROUTINE_PREVIEW_URL }}
      HUB_HML_REVIEW_PASSWORD: ${{ secrets.HUB_ROUTINE_REVIEW_PASSWORD }}
      HUB_HML_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - run: node scripts/routine-preview.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rotina-previa-externa
          path: .validation/routine-external
          retention-days: 7
