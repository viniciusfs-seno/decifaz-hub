name: Supabase local e navegador

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-with-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUB_REAL_E2E: '1'
      VITE_HUB_MODE: shared
      VITE_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: npm ci
      - run: bash scripts/prepare-browser-deps.sh
      - run: npx playwright install --with-deps chromium
      - name: Diagnosticar portas locais do runner
        run: |
          ss -lntp '( sport = :54321 or sport = :54322 or sport = :54324 )'
          docker ps --format '{{.Names}} {{.Ports}}'
      - run: node scripts/start-local-stack.mjs
      - name: Testar com a pilha local
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          export VITE_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:?Chave publicável local ausente}"
          export HUB_TEST_ADMIN_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:?Chave administrativa local ausente}}"
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/financeiro_jornada.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/papeis_associacoes.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/equipe.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/historico_papeis.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/convites.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/integrantes_ativos.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/revisao_operacional.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/fechamentos.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/identificacao_integrantes.sql
          docker exec -i supabase_db_decifaz-hub-e2e psql -U postgres -v ON_ERROR_STOP=1 < supabase/tests/nomes_no_espaco.sql
          npm run test:e2e -- --workers=1 shared-real.spec.mjs roles-real.spec.mjs concurrency-real.spec.mjs team-real.spec.mjs team-concurrency-real.spec.mjs role-history-real.spec.mjs invites-real.spec.mjs invite-auth-real.spec.mjs member-state-real.spec.mjs operational-real.spec.mjs catalog-real.spec.mjs meeting-studio-real.spec.mjs management-real.spec.mjs commercial-management-real.spec.mjs experience-real.spec.mjs lead-details-real.spec.mjs crm-pagination-real.spec.mjs metric-history-real.spec.mjs contracts-real.spec.mjs internal-finance-real.spec.mjs project-meetings-real.spec.mjs hierarchy-real.spec.mjs record-work-real.spec.mjs global-search-real.spec.mjs prospecting-real.spec.mjs productivity-real.spec.mjs activity-work-real.spec.mjs activity-clock-real.spec.mjs workspace-refresh-real.spec.mjs import-real.spec.mjs workbench-real.spec.mjs daily-use-real.spec.mjs member-labels-real.spec.mjs due-center-real.spec.mjs notice-processing-real.spec.mjs financial-week-real.spec.mjs ux-daily-real.spec.mjs commercial-registration-real.spec.mjs digital-triage-real.spec.mjs screen-link-real.spec.mjs
      - name: Homologar avisos sem navegador e captura no Mailpit
        run: node scripts/notice-validation.mjs
      - name: Comparar UX com frontend publicado do PR 44
        run: node scripts/ux-baseline-captures.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rotina-integrada-capturas
          path: |
            .validation/record-captures
            .validation/search-captures
            .validation/daily-captures
            .validation/member-label-captures
            .validation/dues-captures
            .validation/financial-week
            .validation/digital-triage
            .validation/commercial-registration
            .validation/ux-daily
            .validation/screen-captures
          retention-days: 7
      - name: Validar migração de vínculos existentes do PR 17
        run: node scripts/member-state-migration-validation.mjs --reset-local-fixtures
      - name: Ensaiar Central e processamento desativado a partir de produção
        run: node scripts/notices-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar expansão integrada a partir do esquema do PR 18
        run: node scripts/integrated-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar ficha, paginação e histórico a partir do PR 23
        run: node scripts/crm-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar prioridades a partir do esquema atual de produção
        run: node scripts/registry-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar produtividade e recuperação com o frontend do PR 33
        run: node scripts/productivity-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar busca e recuperação a partir do esquema de produtividade
        run: node scripts/search-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar diretório e recuperação com o frontend da mesa de trabalho
        run: node scripts/directory-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar nomes por espaço com frontend anterior e recuperação
        run: node scripts/member-label-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar tela por link com frontend anterior e recuperação
        run: node scripts/screen-upgrade-validation.mjs --reset-local-fixtures
      - name: Ensaiar revisão financeira a partir do esquema publicado
        run: node scripts/financial-week-upgrade.mjs --reset-local-fixtures
      - name: Validar transição e recuperação com versões anteriores
        run: node scripts/transition-validation.mjs --reset-local-fixtures
      - if: always()
        run: supabase stop --no-backup
